[build]
  command = "npm run netlify-build"
  publish = ".next"

# Next.js 会把部分环境变量打进构建产物；若勾了密钥扫描，下列键允许出现在输出中。
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,ADMIN_PASSWORD,ADMIN_SESSION_SECRET,DEEPSEEK_API_KEY,DEEPSEEK_BASE_URL,DEEPSEEK_MODEL,BLOB_READ_WRITE_TOKEN"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
